# ==============================================================================
# RENDER BLUEPRINT — SnowCap Insights 滾雪球洞察科技
# ==============================================================================
# 一鍵部署：在 Render Dashboard 連 GitHub repo，選 "New Blueprint" 即可。
# 免費方案需注意：
#   1. 30 分鐘無流量會休眠（第一次喚醒約 30 秒）
#   2. 沒有持久磁碟，data/themes.json 會在重啟時清空 — 點「同步最新集數」即可重建
#   3. 想真正持久化請：(a) 升級到 Starter 並加 disk，或 (b) 設定 Cloudflare R2 將 data/themes.json 自動備份
# ==============================================================================

services:
  - type: web
    name: snowcap-insights
    runtime: node
    plan: free

    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"

    envVars:
      - key: NODE_ENV
        value: production

      # 釘 Node 20（專案 deps 要求 ≥20；避免重演 Node18 的 @tailwindcss/oxide 原生綁定問題）
      - key: NODE_VERSION
        value: "20"

      - key: PORT
        value: 10000

      # 選填：Gemini API Key（不填 → 走免費策略清單；要付費版 AI 才需在 https://aistudio.google.com 申請）
      - key: GEMINI_API_KEY
        sync: false

      # ----------------------------------------------------------------------
      # 選填：Cloudflare R2（將同步資料、研究結果自動備份雲端）
      # ----------------------------------------------------------------------
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET_NAME
        sync: false
